name: Add Email Subscriber

on:
  # Triggered manually with email input
  workflow_dispatch:
    inputs:
      email:
        description: 'Email address to subscribe'
        required: true
        type: string

jobs:
  add-subscriber:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Add subscriber
        env:
          NEW_SUBSCRIBER_EMAIL: ${{ github.event.inputs.email }}
        run: python scripts/add_subscriber.py

      - name: Commit updated subscribers
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/subscribers.json
          git diff --staged --quiet || git commit -m "Add subscriber $(date +'%Y-%m-%d %H:%M')"
          git push
