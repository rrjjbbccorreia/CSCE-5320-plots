name: Monitor Tactical Portfolio Changes

on:
  schedule:
    # Run daily at 9:00am ET (13:00 UTC) on weekdays
    - cron: '0 13 * * 1-5'
  workflow_dispatch:  # manual trigger

jobs:
  check-and-notify:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check for tactical portfolio changes
        id: check
        run: python scripts/check_tactical_changes.py

      - name: Commit history update if changed
        if: steps.check.outputs.portfolio_changed == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/tactical_history.json data/tactical_changed.flag
          git diff --staged --quiet || git commit -m "Tactical portfolio update $(date +'%Y-%m-%d')"
          git push

      - name: Send tactical email notifications if changed
        if: steps.check.outputs.portfolio_changed == 'true'
        continue-on-error: true
        env:
          SENDGRID_API_KEY:    ${{ secrets.SENDGRID_API_KEY }}
          SENDGRID_FROM_EMAIL: ${{ secrets.SENDGRID_FROM_EMAIL }}
        run: python scripts/send_notifications.py

      - name: Log result
        run: |
          if [ "${{ steps.check.outputs.portfolio_changed }}" == "true" ]; then
            echo "✅ Portfolio changed — history updated and notifications sent"
          else
            echo "✓ No changes detected"
          fi
