name: Update Pick Prices

on:
  schedule:
    # Every 15 minutes Mon-Fri during market hours (13:30-21:00 UTC = 9:30am-5pm ET)
    - cron: '*/15 13-21 * * 1-5'
    # Final update at 5:15pm ET (after market + 1hr buffer)
    - cron: '15 21 * * 1-5'
  workflow_dispatch:

jobs:
  update-pick-prices:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    # Retry up to 3 times if runner unavailable
    strategy:
      fail-fast: false
      max-parallel: 1

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch pick prices
        run: python scripts/fetch_pick_prices.py

      - name: Commit and push prices file
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/pick_prices.json
          git diff --staged --quiet || git commit -m "Auto-update pick prices $(date +'%Y-%m-%d %H:%M UTC')"
          git push
